<script>
let modoDimension=1,modoCuantico=false,audioContext,analyser,dataArray,nivelAudio=0,synthActivo=false,osciladores=[];
const SELLO="KRONOS-TRACE-PVA-5204160405358537-KRONOS-MT01JAAF",SHA="a4ff808e";
let lastTime=performance.now(),frameCount=0;
document.getElementById("btn-micro").addEventListener("click",async()=>{
try{let s=await navigator.mediaDevices.getUserMedia({audio:true});audioContext=new(window.AudioContext||window.webkitAudioContext)();let src=audioContext.createMediaStreamSource(s);analyser=audioContext.createAnalyser();analyser.fftSize=64;src.connect(analyser);dataArray=new Uint8Array(analyser.frequencyBinCount);document.getElementById("btn-micro").innerText="● AUDIO ENLAZADO";document.getElementById("txt-audio").innerText="ENLAZADO "+SHA;document.getElementById("btn-micro").style.background="#fff";}catch(e){alert("Mic denegado")}});
document.getElementById("btn-synth").addEventListener("click",()=>{
if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
synthActivo=!synthActivo;
if(synthActivo){document.getElementById("btn-synth").innerText="■ DETENER SINTETIZADOR";for(let i=0;i<3;i++){let osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type="sine";osc.frequency.value=55*(i+1);gain.gain.value=0.03;osc.connect(gain);gain.connect(audioContext.destination);osc.start();osciladores.push({osc,gain,base:55*(i+1)});}}else{document.getElementById("btn-synth").innerText="♪ SINTETIZADOR AMBIENTAL";osciladores.forEach(o=>o.osc.stop());osciladores=[];}});

for(let i=0;i<COUNT;i++){positions[i*3]=(Math.random()-0.5)*8;positions[i*3+1]=0;positions[i*3+2]=0;boids.push({pos:new THREE.Vector3(positions[i*3],0,0),estado0:new THREE.Vector3((Math.random()-0.5)*8,(Math.random()-0.5)*5,(Math.random()-0.5)*5),estado1:new THREE.Vector3((Math.random()-0.5)*2,(Math.random()-0.5)*2,(Math.random()-0.5)*2),vel:new THREE.Vector3((Math.random()-0.5)*0.04,(Math.random()-0.5)*0.04,(Math.random()-0.5)*0.04),acc:new THREE.Vector3(),fase:Math.random()*Math.PI*2});}

boids.forEach((b,i)=>{

});

cristales.forEach((c,idx)=>{c.rotation.y+=0.02;c.rotation.x+=0.01;let s=1+(nivelAudio*0.01);c.scale.set(s,s,s);});
if(modoDimension===1){camera.position.set(0,0,5);camera.lookAt(0,0,0);terrain.material.opacity=0.01;refLine.material.color.setHex(0x00ffcc);}
